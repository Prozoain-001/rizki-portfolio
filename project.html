<head>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/project.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page-transition" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="index.html">RS</a>
  <nav class="nav-list" aria-label="Primary">
    <a href="index.html">Index</a>
    <a href="work.html" aria-current="page">Work</a>
    <a href="experiments.html">Experiments</a>
    <a href="about.html">About</a>

  </nav>

</header>

<nav id="mobile-nav" class="mobile-nav" aria-label="Mobile">
  <a href="index.html">Index</a>
  <a href="work.html">Work</a>
  <a href="experiments.html">Experiments</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</nav>

<main id="main">
  <div id="project-content">
    <!-- rendered by JS from data.js based on ?slug= -->
    <noscript>Please enable JavaScript to view this project.</noscript>
  </div>
</main>

<footer class="site-footer">
  <span>Rizki Setiawan © 2026</span>
  <span>Jakarta / Indonesia</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
(function renderProjectDetail() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const p = getProject(slug) || PROJECTS[0];
  const content = document.getElementById('project-content');
  document.getElementById('page-title').textContent = p.title + ' — Rizki Setiawan';

  const idx = PROJECTS.findIndex(x => x.slug === p.slug);
  const next = PROJECTS[(idx + 1) % PROJECTS.length];

  function mediaGrid(images, single) {
    if (!images || !images.length) {
      return `<div class="project-media-grid single"><img src="${p.heroImage}" alt="${p.title} visual placeholder" loading="lazy"></div>`;
    }
    return `<div class="project-media-grid ${single ? 'single' : ''}">
      ${images.map(src => `<img src="${src}" alt="${p.title} visual" loading="lazy">`).join('')}
    </div>`;
  }

  content.innerHTML = `
    <section class="project-hero">
      <div class="project-hero__bg" data-parallax="0.15"><img src="${p.heroImage}" alt="${p.title} hero image"></div>
      <div>
        <span class="eyebrow">01 — Intro</span>
        <h1 class="project-hero__title serif">${p.title}</h1>
        <dl class="project-hero__meta">
          <div><dt>Category</dt><dd>${p.category}</dd></div>
          <div><dt>Year</dt><dd>${p.year}</dd></div>
          <div><dt>Location</dt><dd>${p.location}</dd></div>
          <div><dt>Area</dt><dd>${p.area}</dd></div>
          <div><dt>Role</dt><dd>${p.role}</dd></div>
        </dl>
      </div>
    </section>

    <section class="project-block reveal">
      <span class="project-block__num">02 — Concept</span>
      <h2 class="project-block__title serif">${p.concept}</h2>
      <p class="project-block__text">${p.brief} ${p.mood}</p>
    </section>

    <section class="project-block reveal">
      <span class="project-block__num">03 — Structure</span>
      <h2 class="project-block__title serif">Plan, section &amp; facade</h2>
      ${mediaGrid([...(p.plans||[]), ...(p.sections||[]), ...(p.facade||[])])}
    </section>

    <section class="project-block reveal">
      <span class="project-block__num">04 — Space</span>
      <h2 class="project-block__title serif">Interior &amp; atmosphere</h2>
      ${mediaGrid(p.renders)}
    </section>

    <section class="project-block reveal">
      <span class="project-block__num">05 — Details</span>
      <h2 class="project-block__title serif">Material &amp; detail</h2>
      ${mediaGrid(p.details)}
    </section>

    <section class="project-block reveal">
      <span class="project-block__num">06 — Final</span>
      <div class="project-final-gallery" style="margin-top:var(--sp-5);">
        ${p.gallery.map(src => `<img src="${src}" alt="${p.title} final gallery image" loading="lazy">`).join('')}
      </div>
    </section>

    <nav class="project-nav">
      <a href="work.html" data-cursor="Open"><span class="eyebrow">Back to</span>Index</a>
      <a href="project.html?slug=${next.slug}" data-cursor="Open"><span class="eyebrow">Next Project</span>${next.title}</a>
    </nav>
  `;

  initReveals(content);
  initParallax();
})();
</script>
</body>
</html>
